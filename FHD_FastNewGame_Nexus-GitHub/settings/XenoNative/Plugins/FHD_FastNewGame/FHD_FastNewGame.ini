; FHD_FastNewGame configuration for XenoNativeLoader 0.6.5+
[FastNewGame]
; Number of simulated days before the game starts (1 to 300).
; 60 (default) speeds generation by doing less work.
; 300 runs all vanilla days and keeps the original simulation length.
PresimDays=60

; 1 = calculate simulation turns in the generation thread, bypassing
; roughly 600 Start/Wait pairs while preserving original calculation functions.
; 0 = don't apply the direct-calculation optimization.
DirectCalculation=1
